name: Build

on:
  push:
    branches: [ player ]

env:
  WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e83a8e64-04fc-45df-85c6-c2208d03bdb5/w_BaseKit_p_2024.2.0.635_offline.exe
  WINDOWS_HPCKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d500705-397e-41b3-8b2b-2a3da1753fc2/w_HPCKit_p_2024.2.0.633_offline.exe
  WINDOWS_CPP_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
  WINDOWS_DPCPP_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
  CACHE_NUMBER: 6
  SAMPLES_TAG: 2024.2.0
  AI_SAMPLES_TAG: 2024.1.0
  COMPILER_VERSION: 2024.2.0
  TBB_VERSION: 2021.13.0
  VS_VER: vs2022
  QT_VERSION: 6.10.0
  QT_VERSION_MAC: 6.10.0
                
jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: '==3.1.*'
          

      - name: Install Linux dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmpv-dev libcurl4-openssl-dev libssl-dev libxkbcommon-x11-0 libxcb-cursor0
          sudo pip install ninja

      - name: Build on non-Windows
        shell: bash
        run: |-
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_INSTALL_PREFIX=/usr ..
          cmake --build . --config Release --parallel --verbose

  macOS:
    strategy:
      matrix:
        include:
          - os: macos-13
            osx_architectures: x86_64
          - os: macos-14
            osx_architectures: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Cache qt static build
        id: cache-qt-static-build
        uses: actions/cache@v4
        env:
          cache-name: cache-qt-static-build-macos
        with:
          path: ./Qt
          key: qt-${{ env.QT_VERSION_MAC }}-static-${{ matrix.os }}

      - name: download qt static
        if: ${{ steps.cache-qt-static-build.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "Qt/${{ env.QT_VERSION_MAC}}"
          cd Qt/${{ env.QT_VERSION_MAC }}
          curl -sLO https://sg.yii.li:8443/Qt${{ env.QT_VERSION_MAC }}macos_static.tar.xz
          tar xf Qt${{ env.QT_VERSION_MAC }}macos_static.tar.xz
          otool -L macos_static/bin/lupdate
          ls -l macos_static/bin
          pwd 
          ls -l 
          cd -

      - name: Install MPV
        shell: bash
        run: |
          git clone --recursive --depth=1 https://github.com/cxfksword/MPVKit.git
          cd MPVKit
          if [ ! -d libmpv ]; then mkdir libmpv; fi
          find Sources -name '*' -type f | grep macos | grep -v 'Lib' | grep -v "\.h" | grep -v Info.plist | grep -v Modules | while read file; do
            cp "$file" libmpv/
          done
          cd libmpv
          for file in *; do
            mv "$file" "lib${file}.a"
          done
          cd ..
          find Sources -name 'Lib*' -type f | grep macos | while read file; do
            cp "$file" libmpv/
          done
          cd libmpv
          for file in Lib*; do
            name=${file#Lib}
            mv "$file" "lib${name}.a"
          done
          cd ..
          find Sources -name '*.a' -type f | grep macos | while read file; do cp "$file" libmpv/ ; done
          cp libmpv/* ../libmpv/
          cp -r Sources/Libmpv.xcframework/macos-arm64_x86_64/Libmpv.framework/Headers ../libmpv/include
          cd ..
          pwd
          ls -l $PWD/libmpv

      - name: Install macOS dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |-
          brew install openssl@3 sdl2 nasm ninja expat boost zlib zstd brotli

      - name: Build on macOS
        shell: bash
        run: |-
          mkdir build
          cd build
          cmake -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_BUILD_TYPE=Release -G Ninja "-DCMAKE_PREFIX_PATH=$PWD/../libmpv;$PWD/../Qt/${{ env.QT_VERSION_MAC }}/macos_static" ..
          cmake --build . --config Release --parallel --verbose

      - name: Deploy
        shell: bash
        run: ./scripts/deploy-macos-11.sh

      - name: Upload artifacts mac app bundle
        uses: actions/upload-artifact@v4
        with:
          name: imchenwen-universal-${{ matrix.os }}.zip
          path: imchenwen.app

  MSVC:
    strategy:
      matrix:
        toolset: [cl, icx, clang-cl]
        include:
          - toolset: clang-cl
            clang_link: https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.2/LLVM-20.1.2-win64.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: '==3.1.*'
          

      - name: Patch danmaku2ass_cpp
        run: |
          cd 3rdparty\danmaku2ass_cpp
          dir .
          type CMakeLists.txt
          type ..\danmaku2ass_cpp.patch
          git apply ..\danmaku2ass_cpp.patch

      - name: Set up clang for Windows
        if: matrix.toolset == 'clang-cl'
        shell: cmd
        run: |
          mkdir llvm
          cd llvm
          curl.exe -o LLVM.exe -L ${{ matrix.clang_link }}
          7z.exe x LLVM.exe
          cd ..

      - name: cache intel install
        if: matrix.toolset == 'icx'
        id: cache-install
        uses: actions/cache@v4
        with:
          path: |
              C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat
              C:\Program Files (x86)\Intel\oneAPI\compiler
          key: install-${{ env.CACHE_NUMBER }}-${{ env.WINDOWS_HPCKIT_URL }}-${{ env.WINDOWS_CPP_COMPONENTS }}-compiler-${{ hashFiles('**/scripts/cache_exclude_windows.sh') }}

      - name: install intel
        if: steps.cache-install.outputs.cache-hit != 'true' && matrix.toolset == 'icx'
        run: |
          git clone --depth=1 https://github.com/oneapi-src/oneapi-ci.git oneapi-ci
          cd oneapi-ci
          scripts/install_windows.bat ${{ env.WINDOWS_HPCKIT_URL }} ${{ env.WINDOWS_CPP_COMPONENTS }}

      - name: restore registry on cache hit
        if: steps.cache-install.outputs.cache-hit == 'true' && matrix.toolset == 'icx'
        run:  |
          git clone --depth=1 https://github.com/oneapi-src/oneapi-ci.git oneapi-ci
          cd oneapi-ci
          scripts/restore_registry.bat ${{ env.COMPILER_VERSION }}
  
      - name: Enable MSVC commands
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install MPV on Windows
        shell: cmd
        run: scripts\win-install-mpv.bat

      - name: Build on Windows
        shell: cmd
        env:
          RUNNING_OS: ${{ matrix.os }}
          vc_arch: x64
        run: |-
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" %vc_arch%
          for /f "tokens=* usebackq" %%f in (`dir /b "C:\Program Files (x86)\Intel\oneAPI\compiler\" ^| findstr /V latest ^| sort`) do @set "LATEST_VERSION=%%f"
          echo %LATEST_VERSION%
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\%LATEST_VERSION%\env\vars.bat"
          set PATH="C:\Program Files (x86)\Intel\oneAPI\compiler\%LATEST_VERSION%\bin\";%CD%\llvm\bin;%CD%\jom;%PATH%
          mkdir build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.toolset }} -DCMAKE_CXX_COMPILER=${{ matrix.toolset }} -G Ninja -S . -B build
          cmake --build build --config Release --parallel --verbose

      - name: copy libmmd.dll
        if: matrix.toolset == 'icx'
        shell: cmd
        run: |
          mkdir imchenwen     
          for /f "tokens=* usebackq" %%f in (`dir /b "C:\Program Files (x86)\Intel\oneAPI\compiler\" ^| findstr /V latest ^| sort`) do @set "LATEST_VERSION=%%f"
          echo %LATEST_VERSION%
          copy "C:\Program Files (x86)\Intel\oneAPI\compiler\%LATEST_VERSION%\bin\libmmd.dll" imchenwen\
          
      - name: Deploy
        shell: bash
        run: ./scripts/deploy-windows-latest.sh

      - name: Upload artifacts windows installer
        uses: actions/upload-artifact@v4
        with:
          name: imchenwen-msvc-${{ matrix.toolset }}-x86_64-setup
          path: imchenwen-msvc-x86_64-setup.exe
            
      - name: Upload artifacts windows archive
        uses: actions/upload-artifact@v4
        with:
          name: imchenwen-msvc-${{ matrix.toolset }}-x86_64-qt6
          path: imchenwen

  MinGW:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - mingw_prefix: mingw-w64-ucrt-x86_64
            mingw_arch: UCRT64
            c: gcc
            cxx: g++
            qt: qt6
            qtprefix: ucrt64
            qtdir: lib/cmake/Qt6
          - mingw_prefix: mingw-w64-x86_64
            mingw_arch: MINGW64
            c: gcc
            cxx: g++
            qt: qt6
            qtprefix: mingw64
            qtdir: lib/cmake/Qt6
          - mingw_prefix: mingw-w64-clang-x86_64
            mingw_arch: CLANG64
            c: clang
            cxx: clang++
            qt: qt6
            qtprefix: clang64
            qtdir: lib/cmake/Qt6
    steps: 
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.mingw_arch }}
          install: python ${{ matrix.mingw_prefix }}-zstd ${{ matrix.mingw_prefix}}-zlib ${{ matrix.mingw_prefix }}-boost ${{ matrix.mingw_prefix }}-${{ matrix.qt }} ${{ matrix.mingw_prefix }}-cmake ${{ matrix.mingw_prefix }}-pkg-config ${{ matrix.mingw_prefix }}-python3 ${{ matrix.mingw_prefix }}-gcc ${{ matrix.mingw_prefix }}-ffmpeg ${{ matrix.mingw_prefix }}-libjpeg-turbo ${{ matrix.mingw_prefix }}-lua51 ${{ matrix.mingw_prefix }}-meson ${{ matrix.mingw_prefix }}-glfw ${{ matrix.mingw_prefix }}-xxhash ${{ matrix.mingw_prefix }}-glslang ${{ matrix.mingw_prefix }}-SDL2_image ${{ matrix.mingw_prefix }}-libunwind ${{ matrix.mingw_prefix }}-libcdio  ${{ matrix.mingw_prefix }}-libcdio-paranoia  ${{ matrix.mingw_prefix }}-libdvdnav  ${{ matrix.mingw_prefix }}-rubberband  ${{ matrix.mingw_prefix }}-uchardet  ${{ matrix.mingw_prefix }}-vapoursynth ${{ matrix.mingw_prefix }}-mujs ${{ matrix.mingw_prefix }}-angleproject ${{ matrix.mingw_prefix }}-llvm-libs ${{ matrix.mingw_prefix }}-clang-libs
          
      - uses: actions/checkout@v3
        with:
          submodules: true
                             
      - name: patch hlsdl 
        run: |
          cd 3rdparty\hlsdl
          git apply ..\hlsdl.patch
          
      - name: patch danmaku2ass_cpp 
        run: |
          cd 3rdparty\danmaku2ass_cpp
          dir .
          type CMakeLists.txt
          type ..\danmaku2ass_cpp.patch
          git apply ..\danmaku2ass_cpp.patch
          
      - name: clone mingwdeployqt
        run: |
          git clone https://github.com/missdeer/mingwdeployqt.git
          
      - name: Build mingwdeployqt
        shell: msys2 {0}
        run: |
          export MSYSTEM=${{ matrix.mingw_arch }}
          cd mingwdeployqt
          mkdir build
          cd build
          env PATH=$PATH:/${{ matrix.mingw_arch }}/bin cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.c }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -G Ninja ..
          ninja
          cp mingwdeployqt.exe /${{ matrix.mingw_arch }}/bin/
          cd ../..
          
      - name: checkout mpv
        run: |
          git clone --depth=1 https://github.com/mpv-player/mpv.git

      - name: build mpv
        shell: msys2 {0}
        run: |
          export MSYSTEM=${{ matrix.mingw_arch }}
          export CC=${{ matrix.c }}
          export CXX=${{ matrix.cxx }}
          cd mpv
          env PATH=/${{ matrix.mingw_arch }}/bin/ meson setup build --prefix=/${{ matrix.mingw_arch }} --werror -Dc_args="-Wno-error=deprecated -Wno-error=deprecated-declarations" -D cdda=enabled -D d3d-hwaccel=disabled -D d3d11=enabled -D dvdnav=enabled -D jpeg=enabled -D lcms2=enabled -D libarchive=enabled -D libbluray=enabled -D libmpv=true -D lua=enabled -D rubberband=enabled -D shaderc=enabled -D spirv-cross=enabled -D tests=false -D uchardet=enabled -D vapoursynth=enabled -D javascript=enabled  -D egl-angle-win32=enabled
          env PATH=/${{ matrix.mingw_arch }}/bin/ meson compile -C build
          env PATH=/${{ matrix.mingw_arch }}/bin/ meson install -C build
          cd ..

      - name: build imchenwen
        shell: msys2 {0}
        run: |
          export MSYSTEM=${{ matrix.mingw_arch }}
          mkdir build-imchenwen-${{ matrix.mingw_arch }}
          cd build-imchenwen-${{ matrix.mingw_arch }}
          env PATH=$PATH:/${{ matrix.mingw_arch }}/bin cmake "-DCMAKE_PREFIX_PATH=D:/a/_temp/msys64/${{ matrix.qtprefix }}" "-DQT_DIR=D:/a/_temp/msys64/${{ matrix.qtprefix }}/${{ matrix.qtdir }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.c }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -G Ninja ..
          env PATH=$PATH:/${{ matrix.mingw_arch }}/bin:/${{ matrix.mingw_arch }}/qt6-static/bin cmake --build . --parallel --verbose
          cd ..
          mkdir imchenwen-${{ matrix.mingw_prefix }}
          cp src/scripts/update-parsers.ps1 imchenwen-${{ matrix.mingw_prefix }}/
          cp build-imchenwen-${{ matrix.mingw_arch }}/src/imchenwen.exe imchenwen-${{ matrix.mingw_prefix }}/ 
          cp build-imchenwen-${{ matrix.mingw_arch }}/3rdparty/hlsdl.exe imchenwen-${{ matrix.mingw_prefix }}/
          cd imchenwen-${{ matrix.mingw_prefix }}
          if [ -f "/${{ matrix.mingw_arch }}/bin/windeployqt-qt6.exe" ]; then /${{ matrix.mingw_arch }}/bin/windeployqt-qt6.exe --qmldir="$PWD/../src/qml" $PWD/imchenwen.exe; fi
          if [ -f "/${{ matrix.mingw_arch }}/bin/mingwdeployqt.exe" ]; then /${{ matrix.mingw_arch }}/bin/mingwdeployqt.exe $PWD/imchenwen.exe ; fi
          if [ -f "/${{ matrix.mingw_arch }}/bin/mingwdeployqt.exe" ]; then /${{ matrix.mingw_arch }}/bin/mingwdeployqt.exe $PWD/hlsdl.exe     ; fi
          cp /${{ matrix.mingw_arch }}/bin/ffmpeg.exe ./
          cp ../qt.conf ./
          if [ -f "../scripts/copy_filelist.sh" ]; then env PATH=/${{ matrix.mingw_arch}}/bin:$PATH ../scripts/copy_filelist.sh ${{ matrix.qtprefix }} ; fi
          cd ..
          mv imchenwen-${{ matrix.mingw_prefix }} imchenwen
          
      - name: make installer
        shell: cmd
        run: |
          iscc scripts\win_installer.iss

      - name: rename installer
        shell: msys2 {0}
        run: |
          mv scripts/Output/mysetup.exe ./imchenwen-${{ matrix.mingw_prefix }}-${{ matrix.qt }}-setup.exe
          
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: imchenwen
          name: imchenwen-${{ matrix.mingw_prefix }}-${{ matrix.qt }}

      - name: upload artifact setup
        uses: actions/upload-artifact@v4
        with:
          path: imchenwen-${{ matrix.mingw_prefix }}-${{ matrix.qt }}-setup.exe
          name: imchenwen-${{ matrix.mingw_prefix }}-${{ matrix.qt }}-setup
  
